services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edusphere
      POSTGRES_PASSWORD: ${DB_PASSWORD:-edusphere}
      POSTGRES_DB: edusphere
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edusphere"]
      interval: 5s
      retries: 10
  web:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://edusphere:${DB_PASSWORD:-edusphere}@db:5432/edusphere
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET to a long random string}
    ports: ["3000:3000"]
volumes:
  dbdata:
